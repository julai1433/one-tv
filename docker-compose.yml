# One TV en Docker, para un NAS (o cualquier Linux con Docker). Este es para Synology; en otro NAS cambia las dos rutas
# marcadas con «CAMBIA» (abajo dice cuáles van en Unraid, QNAP y TrueNAS) y arráncalo:
#
#     docker compose up -d
#
# o pégalo como «proyecto» en la app de Docker de tu NAS. Luego abre http://IP-DEL-NAS:8765/bienvenida: ahí eliges
# tus carpetas de videos y música, y la TV. Guía paso a paso: docs/INSTALAR-DOCKER.md
# (Por terminal es más fácil todavía: instalar.sh reconoce el NAS y hace esto solo.)
services:
  one-tv:
    image: ghcr.io/julai1433/one-tv:latest
    container_name: one-tv

    # RED «host»: el contenedor usa la red del propio NAS. Hace falta para encontrar la TV (se busca con un aviso a toda
    # la red de la casa) y para que la TV llegue al servidor por la dirección del NAS. Con ella no se usa «ports».
    network_mode: host

    # Que arranque con el NAS y vuelva solo si algo falla (pero no si lo detienes tú a propósito).
    restart: unless-stopped

    environment:
      # One TV lee como administrador, para poder abrir cualquier carpeta compartida que elijas en el navegador; como
      # van de solo lectura (:ro, abajo), no puede cambiar ni borrar nada en ellas.
      PUID: "0"
      PGID: "0"
      # Las carpetas compartidas que One TV puede ver (las mismas de «volumes», separadas con «:»). CAMBIA en otro NAS:
      #   Unraid: /mnt/user · QNAP: /share · TrueNAS: /mnt/tu-pool
      ONE_TV_COMPARTIDAS: /volume1
      # Tu zona horaria (la hora del registro), opcional.
      TZ: America/Mexico_City
      # Opcional: el nombre con que lo muestra la TV si en la casa hay más de un One TV (por ejemplo «NAS de la sala»).
      # NOMBRE: ""
      # PUERTO: "8765"       # solo si el 8765 ya lo usa otro programa del NAS

    volumes:
      # Datos de One TV (lo que ya viste, favoritos, tu configuración, pósters). CAMBIA en otro NAS:
      #   Unraid: /mnt/user/appdata/one-tv · QNAP: /share/Container/one-tv · TrueNAS: /mnt/tu-pool/docker/one-tv
      - /volume1/docker/one-tv:/datos
      # Todas tus carpetas compartidas, de SOLO LECTURA y en la misma ruta que en el NAS. CAMBIA en otro NAS:
      #   Unraid: /mnt/user:/mnt/user:ro · QNAP: /share:/share:ro · TrueNAS: /mnt/tu-pool:/mnt/tu-pool:ro
      - /volume1:/volume1:ro

    # Opcional: el chip de video Intel o AMD del NAS convierte el video para la TV sin cansar el procesador. Quita el «#»
    # de las dos líneas si tu NAS tiene la carpeta /dev/dri (si no la tiene, Docker no arranca el contenedor con ellas).
    # devices:
    #   - /dev/dri:/dev/dri
